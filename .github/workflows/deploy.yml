# GitHub Pages yayını.
#
# Kendiliğinden çalışmaz: yalnızca GitHub'da Actions > "GitHub Pages'e yayınla"
# > "Run workflow" ile (ya da `gh workflow run deploy.yml`) elle başlatılır.
# Uygulamada giriş/şifre yoktur; yayınlanan adresi bilen herkes uygulamayı
# açabilir, ancak veriler her ziyaretçinin kendi tarayıcısında kalır.

name: GitHub Pages'e yayınla

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Sürüm sabit: "ubuntu-latest" etiketinin başka bir sürüme geçmesi bu iş akışını etkilemez.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
